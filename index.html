    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbfdfe" />

    <!-- Primary meta -->
    <meta
      name="description"
      content="Profesionální tlakové mytí a čištění fasád, střech a dlažby. Bez drahé rekonstrukce, s nezávaznou nabídkou zdarma."

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

      content="Umyjeme Fasádu | profesionální mytí fasád, střech a dlažby"

      content="Profesionální mytí a čištění fasád, střech a dlažby. Nezávazná nabídka zdarma."

      name="twitter:image"
      content="https://www.umyjemefasadu.cz/og-image.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Inter:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Umyjeme Fasádu | profesionální mytí fasád, střech a dlažby</title>

    <!-- LocalBusiness structured data (helps local SEO + rich results).
         TODO: doplňte adresu (streetAddress, addressLocality, postalCode),
         IČO a oblast působení (areaServed) podle skutečnosti. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Umyjeme Fasádu s.r.o.",
        "image": "https://www.umyjemefasadu.cz/og-image.png",
        "logo": "https://www.umyjemefasadu.cz/logo.svg",
        "url": "https://www.umyjemefasadu.cz/",
        "telephone": "+420775222760",
        "email": "info@umyjemefasadu.cz",
        "priceRange": "$$",
        "description": "Profesionální tlakové mytí a čištění fasád, střech a dlažby. Nezávazná nabídka zdarma.",
        "areaServed": "Česká republika",
        "knowsAbout": [
          "mytí fasád",
          "čištění střech",
          "čištění dlažby",
          "odstranění graffiti",
          "nanoimpregnace"
        ]
      }
    </script>

    <!-- FAQPage structured data - mirror of the on-page FAQ (src/components/Faq.tsx);
         keep the two in sync when the copy changes. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Jak dlouho vydrží fasáda čistá?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Po vyčištění nanášíme nanoimpregnaci, která brání opětovnému růstu plísní a usazování nečistot. Podle typu fasády, povětrnostních podmínek a okolí se její účinek pohybuje zhruba mezi 5 a 10 lety."
            }
          },
          {
            "@type": "Question",
            "name": "Nepoškodí tlakové mytí omítku?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ne. Tlak, teplotu vody i trysky volíme vždy podle typu a stavu omítky. U citlivějších povrchů sáhneme po šetrnější variantě bez horké vody, s přípravkem a aktivní pěnou."
            }
          },
          {
            "@type": "Question",
            "name": "Jsou použité přípravky bezpečné?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ano. Používáme ekologické a bezpečné přípravky, které jsou ohleduplné k okolí i k povrchu budovy. Zároveň jsme pojištěni u pojišťovny Generali."
            }
          },
          {
            "@type": "Question",
            "name": "Kolik to bude stát?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cenu stanovujeme individuálně podle konkrétního objektu. Přijedeme na nezávaznou prohlídku zdarma, objekt zaměříme a připravíme cenovou nabídku na míru, bez poplatků a závazků."
            }
          },
          {
            "@type": "Question",
            "name": "Co všechno umíte vyčistit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fasády, střechy, dlažbu i chodníky. Odstraníme plísně, mech, řasy, saze, prach i graffiti a nečistoty, které na povrch nepatří. Nabízíme také nátěry a opravy fasád."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
