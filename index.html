<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (/^\/dev\/?$/i.test(location.pathname))
        document.documentElement.classList.add("admin-route");
    </script>
    <style>
      .admin-route #root {
        visibility: hidden;
      }
    </style>

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbfdfe" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="preload" as="image" href="/media/logo-nav.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="image"
      href="/media/dirty-hero.webp"
      fetchpriority="high"
      media="(min-width: 640px)"
    />
    <link
      rel="preload"
      as="image"
      href="/media/clean-hero.webp"
      fetchpriority="high"
      media="(min-width: 640px)"
    />

    <!-- Primary meta -->
    <meta
      name="description"
      content="Profesionální tlakové mytí a čištění fasád, střech a dlažby. Postup a cenová nabídka podle skutečného stavu objektu."
    />
    <link rel="canonical" href="https://www.umyjemefasadu.cz/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:site_name" content="Umyjeme Fasádu" />
    <meta
      property="og:title"
      content="Umyjeme Fasádu | profesionální mytí fasád, střech a dlažby"
    />
    <meta
      property="og:description"
      content="Profesionální mytí a čištění fasád, střech a dlažby. Postup a cenová nabídka podle skutečného stavu objektu."
    />
    <meta property="og:url" content="https://www.umyjemefasadu.cz/" />
    <meta property="og:image" content="https://www.umyjemefasadu.cz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Umyjeme Fasádu | profesionální mytí fasád, střech a dlažby"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Umyjeme Fasádu | profesionální mytí fasád, střech a dlažby"
    />
    <meta
      name="twitter:description"
      content="Profesionální mytí a čištění fasád, střech a dlažby. Nabídka podle stavu objektu."
    />
    <meta name="twitter:image" content="https://www.umyjemefasadu.cz/og-image.png" />
    <title>Umyjeme Fasádu | profesionální mytí fasád, střech a dlažby</title>

    <!-- LocalBusiness a FAQPage data se generují za běhu ze stejného obsahu
         jako stránka (src/main.tsx), takže zůstávají v synchronu s /dev. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
