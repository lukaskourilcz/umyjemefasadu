<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Stránka nenalezena | Umyjeme Fasádu</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fbfdfe;
        color: #101820;
      }
      main {
        width: min(560px, calc(100% - 48px));
      }
      img {
        width: 150px;
        height: auto;
      }
      p:first-of-type {
        margin: 40px 0 8px;
        color: #087eaf;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1.02;
        letter-spacing: -0.045em;
      }
      p {
        max-width: 48ch;
        color: #4b5a64;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        margin-top: 18px;
        padding: 14px 22px;
        border-radius: 12px;
        background: #d80076;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #087eaf;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/media/logo-nav.webp" alt="Umyjeme Fasádu" />
      <p>Chyba 404</p>
      <h1>Tady žádná fasáda není.</h1>
      <p>
        Odkaz je neplatný nebo se stránka přesunula. Na hlavní stránce najdete služby, orientační
        ceny i přímý kontakt.
      </p>
      <a href="/">Zpět na hlavní stránku</a>
    </main>
  </body>
</html>
